<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiv Viktorina</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quiz-container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }

        .question-text {
            font-size: 18px;
            color: #444;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: #e2e6ea;
            border-color: #cbd3da;
        }

        .option-btn.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }

        .option-btn.incorrect {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        .next-btn, .restart-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
            display: none;
        }

        .next-btn:hover, .restart-btn:hover {
            background: #5a6fd6;
        }

        .score-section {
            text-align: center;
            display: none;
        }

        .score-section h3 {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }

        .score-section p {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h2>Web Dasturlash Viktorinasi</h2>
        
        <div id="quiz-box">
            <div id="question-container" class="question-text">Savol yuklanmoqda...</div>
            <div class="options-container" id="options-container">
                <!-- Variantlar shu yerga JS orqali qo'shiladi -->
            </div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Keyingi savol</button>
        </div>

        <div class="score-section" id="score-section">
            <h3>Natijangiz</h3>
            <p id="score-text"></p>
            <button class="restart-btn" id="restart-btn" onclick="restartQuiz()">Qaytadan boshlash</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "HTML qanday ma'noni anglatadi?",
                options: [
                    "Hyper Text Markup Language",
                    "High Tech Modern Language",
                    "Hyper Transfer Machine Language",
                    "Home Tool Markup Language"
                ],
                answer: 0
            },
            {
                question: "CSS nima uchun ishlatiladi?",
                options: [
                    "Saytga mantiq berish uchun",
                    "Ma'lumotlar bazasini boshqarish uchun",
                    "Sahifani bezash va dizayn qilish uchun",
                    "Server bilan bog'lanish uchun"
                ],
                answer: 2
            },
            {
                question: "Quyidagilardan qaysi biri JavaScript dasturlash tiliga kiradi?",
                options: ["Python", "React", "C++", "Java"],
                answer: 1 // React - JavaScript kutubxonasi/ekotizimi sifatida eng yaqin variant
            },
            {
                question: "Web sahifada katakchalar (grid) yaratish uchun qaysi CSS xossasi ishlatiladi?",
                options: ["flexbox", "display: grid", "align-items", "float"],
                answer: 1
            },
            {
                question: "JavaScript'da o'zgaruvchi e'lon qilish uchun qaysi kalit so'z ishlatilmaydi?",
                options: ["var", "let", "const", "static"],
                answer: 3
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionContainer = document.getElementById("question-container");
        const optionsContainer = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");
        const quizBox = document.getElementById("quiz-box");
        const scoreSection = document.getElementById("score-section");
        const scoreText = document.getElementById("score-text");

        function loadQuestion() {
            answered = false;
            nextBtn.style.display = "none";
            optionsContainer.innerHTML = "";

            let currentQuestion = questions[currentQuestionIndex];
            questionContainer.innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.classList.add("option-btn");
                button.innerText = option;
                button.addEventListener("click", () => selectOption(index, button));
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedIndex, selectedButton) {
            if (answered) return;
            answered = true;

            let currentQuestion = questions[currentQuestionIndex];
            const allButtons = optionsContainer.querySelectorAll(".option-btn");

            if (selectedIndex === currentQuestion.answer) {
                selectedButton.classList.add("correct");
                score++;
            } else {
                selectedButton.classList.add("incorrect");
                allButtons[currentQuestion.answer].classList.add("correct");
            }

            // Barcha tugmalarni bloklash
            allButtons.forEach(btn => btn.disabled = true);
            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showScore();
            }
        }

        function showScore() {
            quizBox.style.display = "none";
            scoreSection.style.display = "block";
            scoreText.innerText = `Siz 5 ta savoldan ${score} tasiga to'g'ri javob berdingiz!`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            scoreSection.style.display = "none";
            quizBox.style.display = "block";
            loadQuestion();
        }

        // Ilk savolni yuklash
        loadQuestion();
    </script>
</body>
</html>
